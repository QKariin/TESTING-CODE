name: TikTok Agent

on:
  schedule:
    - cron: '0 6 * * *'   # 9 AM Athens time (UTC+3) every day
  workflow_dispatch:        # Manual trigger from GitHub Actions tab / dashboard button

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get install -y -q ffmpeg
          wget -q https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          chmod +x /usr/local/bin/yt-dlp
          pip install -q --break-system-packages requests pycryptodomex websockets brotlicffi

      - name: Write TikTok cookies
        run: |
          if [ -z "${{ secrets.TIKTOK_COOKIES }}" ]; then
            echo "ERROR: TIKTOK_COOKIES secret is empty"
            exit 1
          fi
          echo "${{ secrets.TIKTOK_COOKIES }}" | base64 -d > /tmp/cookies.txt || {
            echo "ERROR: base64 decode failed - secret is not valid base64"
            exit 1
          }
          echo "Cookies written: $(wc -l < /tmp/cookies.txt) lines"

      - name: Download and upload to app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIKTOK_USERNAME: tinuka25
        run: |
          python3 << 'PYEOF'
          import subprocess, os, re, requests, datetime, sys, glob

          SUPABASE_URL = os.environ.get('SUPABASE_URL', '')
          SERVICE_KEY  = os.environ.get('SUPABASE_SERVICE_ROLE_KEY', '')
          BOT_TOKEN    = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          CHAT_ID      = os.environ.get('TELEGRAM_CHAT_ID', '')
          USERNAME     = os.environ.get('TIKTOK_USERNAME', 'tinuka25')

          missing = [k for k, v in {'SUPABASE_URL': SUPABASE_URL, 'SUPABASE_SERVICE_ROLE_KEY': SERVICE_KEY, 'TELEGRAM_BOT_TOKEN': BOT_TOKEN, 'TELEGRAM_CHAT_ID': CHAT_ID}.items() if not v]
          if missing:
              print(f'FATAL: missing secrets: {missing}')
              sys.exit(1)

          today = datetime.date.today().isoformat()
          yesterday = (datetime.date.today() - datetime.timedelta(days=1)).isoformat()
          expires_at = (datetime.datetime.utcnow() + datetime.timedelta(hours=24)).isoformat() + 'Z'

          headers = {
              'Authorization': f'Bearer {SERVICE_KEY}',
              'apikey': SERVICE_KEY,
              'Content-Type': 'application/json',
          }

          def tg(text):
              try:
                  requests.post(
                      f'https://api.telegram.org/bot{BOT_TOKEN}/sendMessage',
                      json={'chat_id': CHAT_ID, 'text': text, 'parse_mode': 'HTML', 'disable_web_page_preview': True},
                      timeout=10
                  )
              except: pass

          def find_member_in_text(text):
              """Search DB for a member whose name or email prefix appears in the text."""
              if not text: return None
              r = requests.get(
                  f'{SUPABASE_URL}/rest/v1/profiles?select=member_id,name&limit=100',
                  headers=headers, timeout=10
              )
              if not r.ok: return None
              profiles = r.json()
              text_lower = text.lower()
              for p in profiles:
                  name = (p.get('name') or '').strip()
                  email_prefix = (p.get('member_id') or '').split('@')[0]
                  if name and len(name) > 2 and name.lower() in text_lower:
                      return p['member_id']
                  if email_prefix and len(email_prefix) > 3 and email_prefix.lower() in text_lower:
                      return p['member_id']
              return None

          # Check which TikTok IDs are already saved (all time, not just today)
          r = requests.get(
              f'{SUPABASE_URL}/rest/v1/stories?source=eq.tiktok&select=source_id&limit=500',
              headers=headers, timeout=10
          )
          existing_ids = {row['source_id'] for row in (r.json() if r.ok else []) if row.get('source_id')}
          print(f'Already saved (all time): {len(existing_ids)} videos')

          # Fetch latest videos + descriptions from TikTok
          result = subprocess.run([
              'yt-dlp',
              '--cookies', '/tmp/cookies.txt',
              '--flat-playlist',
              '--playlist-end', '5',
              '--print', '%(id)s',
              f'https://www.tiktok.com/@{USERNAME}',
          ], capture_output=True, text=True, timeout=120)

          if result.returncode != 0:
              err_snippet = result.stderr[-400:] if result.stderr else '(no stderr)'
              print(f'yt-dlp listing error (rc={result.returncode}): {err_snippet}')
              tg(f'⚠️ yt-dlp error (rc={result.returncode}):\n<code>{err_snippet[-300:]}</code>')
          print(f'yt-dlp raw stdout: {result.stdout[:500]}')
          video_ids = [l.strip() for l in result.stdout.strip().split('\n') if l.strip() and not l.startswith('[')]
          print(f'Found {len(video_ids)} video IDs from TikTok')

          new_videos = []
          skip_reasons = []
          for vid_id in video_ids:
              if vid_id in existing_ids:
                  print(f'Skipping {vid_id} — already saved')
                  skip_reasons.append(f'{vid_id}: already saved')
                  continue
              new_videos.append({'id': vid_id})

          if not new_videos:
              already = len(existing_ids)
              detail = '\n'.join(skip_reasons) if skip_reasons else 'yt-dlp returned 0 IDs (cookie auth?)'
              tg(f'TikTok: 0 new videos.\nyt-dlp found {len(video_ids)} total · {already} already saved · date: {today}\n\n<code>{detail}</code>')
              sys.exit(0)

          print(f'{len(new_videos)} new videos to process')
          uploaded = 0
          tagged_summary = []

          for idx, video in enumerate(new_videos):
              vid_id      = video['id']
              url         = f'https://www.tiktok.com/@{USERNAME}/video/{vid_id}'

              # Download video (also grab title/description via --print-json written to file)
              print(f'Downloading {vid_id}...')
              dl = subprocess.run([
                  'yt-dlp',
                  '--cookies', '/tmp/cookies.txt',
                  '-o', f'/tmp/{vid_id}.%(ext)s',
                  '--merge-output-format', 'mp4',
                  '--no-playlist',
                  '--write-info-json',
                  url,
              ], capture_output=True, text=True, timeout=300)

              # Try to read title/description from info json
              import json as _json
              info_files = glob.glob(f'/tmp/{vid_id}.info.json')
              title = ''
              description = ''
              if info_files:
                  try:
                      with open(info_files[0]) as _f:
                          _info = _json.load(_f)
                          title = _info.get('title', '') or ''
                          description = _info.get('description', '') or ''
                  except: pass
              full_text = f'{title} {description}'

              # Auto-detect tagged member from description
              tagged_email = find_member_in_text(full_text)
              tagged_members = [tagged_email] if tagged_email else []
              if tagged_email:
                  print(f'Auto-tagged {tagged_email} based on description')

              files = glob.glob(f'/tmp/{vid_id}.*')
              if not files:
                  print(f'Download failed: {dl.stderr[-300:]}')
                  continue

              filepath = files[0]
              storage_path = f'tiktok_stories/{today}_{vid_id}.mp4'

              # Upload to Supabase storage
              print(f'Uploading → {storage_path}')
              with open(filepath, 'rb') as f:
                  up = requests.post(
                      f'{SUPABASE_URL}/storage/v1/object/media/{storage_path}',
                      headers={'Authorization': f'Bearer {SERVICE_KEY}', 'Content-Type': 'video/mp4'},
                      data=f, timeout=300
                  )
              if not up.ok:
                  print(f'Upload failed: {up.text}')
                  continue

              public_url = f'{SUPABASE_URL}/storage/v1/object/public/media/{storage_path}'

              # Save to stories table
              ins = requests.post(
                  f'{SUPABASE_URL}/rest/v1/stories',
                  headers={**headers, 'Prefer': 'return=minimal'},
                  json={
                      'date': today,
                      'media_url': public_url,
                      'media_type': 'video',
                      'order_index': idx,
                      'caption': title[:200] if title else '',
                      'source': 'tiktok',
                      'source_id': vid_id,
                      'tagged_members': tagged_members,
                      'expires_at': expires_at,
                      'archived': False,
                  },
                  timeout=10
              )

              if ins.ok:
                  uploaded += 1
                  if tagged_email:
                      tagged_summary.append(tagged_email.split('@')[0])
                  print(f'Saved {vid_id}' + (f' → personalized for {tagged_email}' if tagged_email else ' → public'))
              else:
                  print(f'DB insert failed: {ins.text}')

          # Telegram summary
          if uploaded > 0:
              msg = f'<b>{uploaded} new {"story" if uploaded == 1 else "stories"} live!</b>\nDate: {today} · expires in 24h\n\n'
              if tagged_summary:
                  msg += f'Auto-tagged: <b>{", ".join(tagged_summary)}</b>\n'
                  untagged = uploaded - len(tagged_summary)
                  if untagged > 0:
                      msg += f'{untagged} public (no name found in description)\n'
                  msg += '\nTag more? /tag [name] · /stories for status'
              else:
                  msg += 'No names detected in descriptions — all public.\nTag someone? /tag [name] or /skip'
              tg(msg)
          else:
              tg(f'TikTok: found {len(new_videos)} new videos but all uploads failed. Check Actions log.')

          PYEOF
